apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
  - name: Review PostgreSQL
    uid: review-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    database: code_review_copilot
    user: code_review
    isDefault: false
    editable: false
    jsonData:
      database: code_review_copilot
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
