services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_healthy
      grafana:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://code_review:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/code_review_copilot?schema=public
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8787}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?APP_AUTH_USERNAME is required}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?APP_AUTH_SECRET is required}
      APP_AUTH_SESSION_SECRET: ${APP_AUTH_SESSION_SECRET:?APP_AUTH_SESSION_SECRET is required}
      WORKSPACE_ROOT: /app/.workspaces
      TMPDIR: /app/.workspaces/tmp
      SECURITY_ARTIFACTS_ROOT: /app/security-artifacts
      SECURITY_SKILLS_ROOT: /app/security-skills
      SECURITY_SKILLS: ${SECURITY_SKILLS:-hack}
      SECURITY_SKILL_VERSION: ${SECURITY_SKILL_VERSION:-}
      SECURITY_ACTION_POLICY: /app/security-skills/hack/action-policy.json
      AGENT_BROWSER_BIN: /app/node_modules/.bin/agent-browser
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      AGENT_BROWSER_ARGS: --no-sandbox,--disable-dev-shm-usage
      OCR_DISABLE_THINKING: ${OCR_DISABLE_THINKING:-}
      DINGTALK_WORKER_URL: http://dingtalk-worker:8791
      DINGTALK_WORKER_TOKEN: ${DINGTALK_WORKER_TOKEN:-}
      ZAP_API_URL: ${ZAP_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: 'true'
      OTEL_SERVICE_NAME: code-review-copilot
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=code-review
    ports:
      - '${APP_PORT:-8787}:8787'
    volumes:
      - workspace_data:/app/.workspaces
      - security_artifacts:/app/security-artifacts
    networks:
      default:
        aliases:
          - app.localhost
          - app.local
      database:
      telemetry:
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8787/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  security-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', './deploy/security-worker-entrypoint.sh']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://code_review:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/code_review_copilot?schema=public
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8787}
      APP_AUTH_SESSION_SECRET: ${APP_AUTH_SESSION_SECRET:?APP_AUTH_SESSION_SECRET is required}
      WORKSPACE_ROOT: /app/.workspaces
      TMPDIR: /app/.workspaces/tmp
      SECURITY_ARTIFACTS_ROOT: /app/security-artifacts
      SECURITY_SKILLS_ROOT: /app/security-skills
      SECURITY_SKILLS: ${SECURITY_SKILLS:-hack}
      SECURITY_SKILL_VERSION: ${SECURITY_SKILL_VERSION:-}
      SECURITY_ACTION_POLICY: /app/security-skills/hack/action-policy.json
      AGENT_BROWSER_BIN: /app/node_modules/.bin/agent-browser
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      AGENT_BROWSER_ARGS: --no-sandbox,--disable-dev-shm-usage
      ZAP_API_URL: ${ZAP_API_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DINGTALK_WORKER_URL: http://dingtalk-worker:8791
      DINGTALK_WORKER_TOKEN: ${DINGTALK_WORKER_TOKEN:-}
    volumes:
      - workspace_data:/app/.workspaces
      - security_artifacts:/app/security-artifacts
    networks: [default, database]

  dingtalk-worker:
    profiles: [dingtalk]
    build:
      context: .
      dockerfile: Dockerfile
      target: dingtalk-worker
    restart: unless-stopped
    init: true
    environment:
      DINGTALK_WORKER_TOKEN: ${DINGTALK_WORKER_TOKEN:-}
    volumes:
      - dingtalk_auth:/home/node/.dws
    networks: [default]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8791/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: code_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: code_review_copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'code_review', '-d', 'code_review_copilot']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8787}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./deploy/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [telemetry, database]
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/observability/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  tempo:
    build:
      context: .
      dockerfile: deploy/telemetry.Dockerfile
      target: tempo
    restart: unless-stopped
    command: ['-target=all', '-config.file=/etc/tempo.yml']
    volumes:
      - ./deploy/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks: [telemetry]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3200/ready']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [telemetry]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: deploy/telemetry.Dockerfile
      target: collector
    restart: unless-stopped
    command: ['--config=/etc/collector.yml']
    depends_on:
      tempo:
        condition: service_healthy
    volumes:
      - ./deploy/collector.yml:/etc/collector.yml:ro
    networks: [telemetry]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:13133/']
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  database:
    internal: true
  telemetry:
    internal: true

volumes:
  postgres_data:
  workspace_data:
  security_artifacts:
  grafana_data:
  tempo_data:
  prometheus_data:
  dingtalk_auth:
